pages:
  - sort: 100000
    name: Como usar as chaves
    type: text
    _id: ChavesPagIntro01
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Referência das chaves internas do sistema, para usar em <strong>fórmulas de rolagem</strong>
        (itens, atividades, bônus) e em <strong>Active Effects</strong>.</p><ul><li><strong>Fórmulas</strong>
        usam o caminho com <code>@</code>: ex. <code>2d6 + @abilities.esp.mod</code>.</li><li><strong>Active
        Effects</strong> usam o caminho com <code>system.</code>: ex. Attribute Key
        <code>system.attributes.hp.bonuses.overall</code>.</li></ul><p><strong>Exemplo real</strong> — a Aura
        Adaptável (Conjurador) dá PV extra com um Active Effect
        assim:</p><p><code>system.attributes.hp.bonuses.overall</code> | Add | <code>3 *
        @abilities.esp.mod</code></p><blockquote><p>✅ <strong>Chaves recomendadas:</strong> use
        <code>esp</code> (Espírito) e <code>pre</code> (Presença). As chaves legadas <code>int</code> e
        <code>cha</code> continuam funcionando — são apelidos do MESMO valor, nunca
        divergem.</p></blockquote><p>Outras chaves gerais úteis: <code>@prof</code> (bônus de proficiência),
        <code>@details.level</code> (nível), <code>@abilities.X.save.value</code> (bônus de salvaguarda).</p>
    video:
