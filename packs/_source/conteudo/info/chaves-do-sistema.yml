    text:
      format: 1
      content: >-
        <p>Total da perícia: <code>@skills.CHAVE.total</code> · Passiva:
        <code>@skills.CHAVE.passive</code></p><table><thead><tr><th>Chave</th><th>Perícia</th><th>Atributo</th></tr></thead><tbody><tr><td><code>ath</code></td><td>Atletismo</td><td>Força</td></tr><tr><td><code>acr</code></td><td>Acrobacia</td><td>Agilidade</td></tr><tr><td><code>ste</code></td><td>Furtividade</td><td>Agilidade</td></tr><tr><td><code>pil</code></td><td>Pilotagem</td><td>Agilidade</td></tr><tr><td><code>slt</code></td><td>Prestidigitação</td><td>Agilidade</td></tr><tr><td><code>sci</code></td><td>Ciência</td><td>Sabedoria</td></tr><tr><td><code>his</code></td><td>História</td><td>Sabedoria</td></tr><tr><td><code>inv</code></td><td>Investigação</td><td>Sabedoria</td></tr><tr><td><code>med</code></td><td>Medicina</td><td>Sabedoria</td></tr><tr><td><code>nat</code></td><td>Natureza</td><td>Sabedoria</td></tr><tr><td><code>sur</code></td><td>Sobrevivência</td><td>Sabedoria</td></tr><tr><td><code>tec</code></td><td>Tecnologia</td><td>Sabedoria</td></tr><tr><td><code>nen</code></td><td>Nen</td><td>Espírito</td></tr><tr><td><code>ins</code></td><td>Intuição</td><td>Espírito</td></tr><tr><td><code>prc</code></td><td>Percepção</td><td>Espírito</td></tr><tr><td><code>sob</code></td><td>Sobrenatural</td><td>Espírito</td></tr><tr><td><code>luc</code></td><td>Sorte</td><td>Espírito</td></tr><tr><td><code>prf</code></td><td>Atuação</td><td>Presença</td></tr><tr><td><code>dec</code></td><td>Enganação</td><td>Presença</td></tr><tr><td><code>itm</code></td><td>Intimidação</td><td>Presença</td></tr><tr><td><code>per</code></td><td>Persuasão</td><td>Presença</td></tr><tr><td><code>pro</code></td><td>Provocação</td><td>Presença</td></tr></tbody></table>
