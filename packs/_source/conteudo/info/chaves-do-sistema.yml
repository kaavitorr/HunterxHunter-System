  - sort: 200000
    name: Atributos
    type: text
    _id: ChavesPagAtrib01
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <table><thead><tr><th>Chave</th><th>Atributo</th><th>Modificador (fórmula)</th><th>Valor (Active
        Effect)</th></tr></thead><tbody><tr><td><code>str</code></td><td>Força</td><td><code>@abilities.str.mod</code></td><td><code>system.abilities.str.value</code></td></tr><tr><td><code>dex</code></td><td>Agilidade</td><td><code>@abilities.dex.mod</code></td><td><code>system.abilities.dex.value</code></td></tr><tr><td><code>con</code></td><td>Constituição</td><td><code>@abilities.con.mod</code></td><td><code>system.abilities.con.value</code></td></tr><tr><td><code>esp</code>
        <small>(legado:
        <code>int</code>)</small></td><td><strong>Espírito</strong></td><td><code>@abilities.esp.mod</code></td><td><code>system.abilities.esp.value</code></td></tr><tr><td><code>wis</code></td><td>Sabedoria</td><td><code>@abilities.wis.mod</code></td><td><code>system.abilities.wis.value</code></td></tr><tr><td><code>pre</code>
        <small>(legado:
        <code>cha</code>)</small></td><td>Presença</td><td><code>@abilities.pre.mod</code></td><td><code>system.abilities.pre.value</code></td></tr><tr><td><code>hon</code></td><td>Honra</td><td><code>@abilities.hon.mod</code></td><td><code>system.abilities.hon.value</code></td></tr><tr><td><code>san</code></td><td>Sanidade</td><td><code>@abilities.san.mod</code></td><td><code>system.abilities.san.value</code></td></tr></tbody></table><p>Salvaguarda:
        <code>@abilities.X.save.value</code> · Teste puro: <code>1d20 +
        @abilities.X.mod</code></p><blockquote><p>✅ <code>esp</code> e <code>pre</code> são apelidos oficiais
        de <code>int</code> e <code>cha</code> — funcionam em fórmulas e Active Effects, sempre com o mesmo
        valor. Prefira as novas; as antigas seguem como legado.</p></blockquote>
