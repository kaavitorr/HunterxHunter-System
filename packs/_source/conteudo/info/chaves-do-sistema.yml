  - sort: 400000
    name: Recursos e Vitais
    type: text
    _id: ChavesPagRecur01
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Caminhos para Active Effects (prefixo <code>system.</code>) — em fórmulas troque por <code>@</code>
        (ex.: <code>@attributes.hp.max</code>).</p><h2>Vida e
        Defesa</h2><table><thead><tr><th>Caminho</th><th>O que
        é</th></tr></thead><tbody><tr><td><code>system.attributes.hp.value</code> / <code>.max</code> /
        <code>.temp</code></td><td>Pontos de Vida (atual / máximo /
        temporário)</td></tr><tr><td><code>system.attributes.hp.bonuses.overall</code></td><td>Bônus de PV
        máximo (aceita fórmula — ex. Aura Adaptável)</td></tr><tr><td><code>system.attributes.pve.value</code>
        / <code>.max</code> / <code>.temp</code></td><td>Pontos de Vitalidade
        (PVE)</td></tr><tr><td><code>system.attributes.ac.value</code> / <code>.bonus</code></td><td>Classe de
        Armadura (valor fixo / bônus)</td></tr><tr><td><code>system.armorPoints.value</code></td><td>Pontos de
        Armadura (Foco
        Defensivo)</td></tr><tr><td><code>system.attributes.movement.walk</code></td><td>Deslocamento</td></tr><tr><td><code>system.attributes.inspiration</code></td><td>Inspiração</td></tr></tbody></table><h2>Aura
        (PA)</h2><table><thead><tr><th>Caminho</th><th>O que
        é</th></tr></thead><tbody><tr><td><code>system.energy.max</code></td><td>PA
        Máximo</td></tr><tr><td><code>system.energy.total</code></td><td>PA Total
        (atual)</td></tr><tr><td><code>system.energy.generated</code></td><td>PA
        Gerado</td></tr><tr><td><code>system.energy.bonuses.overall</code> / <code>.level</code></td><td>Bônus
        de PA máximo (fórmulas)</td></tr><tr><td><code>system.energy.bonuses.temp</code> /
        <code>.generatedEnergy</code></td><td>PA temporário / bônus de
        geração</td></tr><tr><td><code>system.attributes.auraActive</code></td><td>Aura ativa
        (true/false)</td></tr><tr><td><code>system.energyDice.value</code> / <code>.max</code> /
        <code>.bonus</code> / <code>.denomination</code></td><td>Dados de Aura (atual / máx / bônus / tipo,
        ex. "d4")</td></tr></tbody></table><h2>Treinamento e Nen</h2><table><thead><tr><th>Caminho</th><th>O
        que é</th></tr></thead><tbody><tr><td><code>system.curseResources.trainingPoints</code></td><td>Pontos
        de Treinamento (PT)</td></tr><tr><td><code>system.curseResources.spentTrainingPoints</code></td><td>PT
        Gastos</td></tr><tr><td><code>system.curseResources.narratorTrainingPoints</code></td><td>PT do
        Narrador</td></tr><tr><td><code>system.curseResources.lostTrainingPoints</code></td><td>PT
        Perdidos</td></tr><tr><td><code>system.curseResources.cursePoints</code></td><td>Pontos de Nen
        (PM)</td></tr></tbody></table>
