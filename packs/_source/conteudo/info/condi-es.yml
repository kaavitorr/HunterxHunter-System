      content: >-
        <hr><ul><li><p class="MsoBodyText">Uma criatura apaixonada é tomada por
        amor ou grande admiração por outra criatura, sentindo-se menos propenso
        a causar danos a ela.</p></li><li><p class="MsoBodyText">Os seguintes
        sintomas podem ou não ocorrer: coração acelerado, agitação, ciúmes leves
        ou a ponto de matar e vontade de estar com o alvo da
        paixão/admiração.</p></li><li><p class="MsoBodyText">Uma criatura
        apaixonada não pode atacar quem o apaixonou ou tê-lo como alvo de
        habilidades ou efeitos nocivos. Quem o apaixonou possui vantagem em
        Testes de Atributo feitos para interagir socialmente com a
        criatura.</p></li></ul>
