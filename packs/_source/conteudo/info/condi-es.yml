    image: {}
    text:
      format: 1
      content: >-
        <hr><ul><li><p class="MsoBodyText">Uma criatura congelada está
        envolvida, juntamente com todos os objetos que estiver vestindo ou
        carregando, por gelo.</p></li><li><p class="MsoBodyText">A criatura está
        incapacitada (veja a condição), não pode se mover ou falar, e não tem
        ciência de seus arredores.</p></li><li><p class="MsoBodyText">A criatura
        não pode utilizar ações de poder;</p></li><li><p class="MsoBodyText">A
        criatura deve passar em uma Salvaguarda de Constituição para não sofrer
        a condição “hipotérmico”.</p></li><li><p class="MsoBodyText">Jogadas de
        ataque contra a criatura possuem vantagem.</p></li><li><p
        class="MsoBodyText">A criatura falha automaticamente em Salvaguardas de
        Constituição e Agilidade.</p></li><li><p class="MsoBodyText">A criatura
        tem resistência a todos os tipos de dano.</p></li><li><p
        class="MsoBodyText">Seu peso é multiplicado por cinco.</p></li><li><p
        class="MsoBodyText">A criatura é imune a veneno e doenças, embora um
        veneno ou doença previamente presente em seu sistema seja apenas
        suspenso, não neutralizado.</p></li></ul>
