  - sort: 1499219
    name: Petrificado
    type: text
    _id: IvoYeweAcCAK4FOp
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <hr><ul><li><p class="MsoBodyText">Uma criatura petrificada está incapaz
        de se mover e suas funções corporais estão pausadas, ela tem a
        superfície do corpo, podendo até ter os músculos, preenchidos com um
        material sólido (geralmente pedra). Seu peso é multiplicado por dez, e
        ela para de envelhecer.</p></li><li><p class="MsoBodyText">A criatura
        está incapacitada (veja a condição), não pode se mover ou falar, e não
        tem ciência de seus arredores ou realizar ações;</p></li><li><p
        class="MsoBodyText">Jogadas de ataque contra a criatura possuem
        vantagem.</p></li><li><p class="MsoBodyText">A criatura falha
        automaticamente em Salvaguardas de Força e Agilidade. A criatura tem
        resistência a todos os tipos de dano.</p></li><li><p
        class="MsoBodyText">A criatura é imune a veneno e doenças, embora um
        veneno ou doença previamente presente em seu sistema seja apenas
        suspenso, não neutralizado.</p></li></ul>
