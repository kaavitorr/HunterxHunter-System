    image: {}
    text:
      format: 1
      content: >-
        <hr><ul><li><p class="MsoListParagraph">Uma criatura inconsciente está
        <strong>incapacitada (veja a condição)</strong>.</p></li><li><p
        class="MsoListParagraph">A criatura não pode realizar nenhum tipo de
        ação ou inação;</p></li><li><p class="MsoListParagraph">A criatura não
        pode usar princípios que gastem Energia Amaldiçoada;</p></li><li><p
        class="MsoListParagraph">Ela não pode se mover ou falar e não tem
        ciência de seus arredores;</p></li><li><p class="MsoListParagraph">A
        criatura larga tudo que estiver segurando e fica caída.</p></li><li><p
        class="MsoListParagraph">A criatura falha automaticamente em
        Salvaguardas de Força ou Agilidade.</p></li><li><p
        class="MsoListParagraph">Jogadas de ataque contra a criatura possuem
        vantagem.</p></li><li><p class="MsoListParagraph">Qualquer ataque que
        atinja a criatura é um acerto crítico, se o atacante estiver a 1,5 metro
        dela.</p></li></ul>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
