      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <hr><ul><li><p class="MsoBodyText">Uma criatura enfurecida tenta atacar
        a todo custo a fonte da sua fúria e recebe desvantagem em suas jogadas
        de ataque. A criatura ataca qualquer outra criatura, amigável ou não,
        que esteja próxima e tente impedir, de qualquer forma, seu combate
        contra quem a enfureceu.</p></li><li><p class="MsoBodyText">Os danos de
        ataques corpo-a-corpo contra quem a enfureceu aumentam em 1d4, enquanto
        a fúria persistir.</p></li><li><p class="MsoBodyText">A fúria se mantém
        por 1 minuto. Ela termina prematuramente se a criatura cair inconsciente
        ou se seu turno acabar e a criatura não tiver atacado nenhuma criatura
        desde seu último turno ou não tiver sofrido dano nesse
        período.</p></li><li><p class="MsoBodyText">Uma criatura amigável pode
        gastar uma ação para fazer um Teste de Atributo de Sabedoria (Persuasão)
        CD 13 para acalmar a criatura enfurecida, com desvantagem enquanto a
        fonte da fúria estiver em sua linha de visão.</p></li></ul>
