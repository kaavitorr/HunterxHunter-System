        propósito de se esconder, a criatura é considerada em área de escuridão
        densa.</p></li><li><p class="MsoBodyText">A localização da criatura pode
        ser detectada por qualquer barulho que ela faça ou rastros que ela
        deixe.</p></li><li><p class="MsoBodyText">Jogadas de ataque contra a
        criatura sofrem desvantagem, e os ataques da criatura possuem
        vantagem.</p></li></ul>
