      content: "<p>Qualquer criatura ou objeto que você manipule pode receber instruções adicionais de aura, permitindo que desenvolva uma forma de ego e seja capaz de se comunicar. Caso seja um lacaio comum, ele passa a ter a capacidade de falar como uma pessoa. Você pode manter apenas um objeto desse tipo por vez ou até três lacaios criados por sua habilidade.\_</p><p>Enquanto possuir uma existência dotada de ego, você pode atacar e utilizar técnicas através dela, gastando suas ações como se estivesse no local onde ela se encontra.</p>"
