  - sort: 1700000
    name: Comandos Avançados
    type: text
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: "<p>Você pode escolher entre reduzir o custo de ativação de suas habilidades em 3 PA (mínimo de 1) ou o custo de suas técnicas em 1 PA. Além disso, qualquer objeto ou criatura sob seu controle continuará executando ações mesmo que você fique inconsciente, não exigindo controle direto.\_</p><p>Se o objeto não possuir Pontos de Vida e CR próprios, ele passa a ter 150 Pontos de Vida e 20 de CR.\_</p><p>Bestas de Nen sem ações, como Potclean, não se beneficiam desse efeito. No entanto, um objeto independente que tenha desenvolvido ego — como uma arma — passa a agir da mesma forma que um lacaio de combate comum.</p>"
