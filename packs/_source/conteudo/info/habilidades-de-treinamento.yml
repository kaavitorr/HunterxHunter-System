  - sort: 900000
    name: Reabsorção de Aura
    type: text
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: "<p>Ao executar uma técnica que envolva a criação de lacaios ou constructos, você pode optar por consumir toda a sua aura máxima para tornar a duração “Especial”, fazendo com que a técnica permaneça ativa até ser desativada manualmente. Quando isso ocorrer, sua aura será restaurada normalmente.\_</p><p>Se a habilidade for cancelada manualmente, você recupera tanto a aura atual quanto a aura máxima utilizadas, desde que mais da metade dos lacaios ou constructos ainda estejam ativos. Caso a habilidade se encerre porque todos foram destruídos, você recupera apenas a aura máxima.\_</p><p>Como alternativa, caso não utilize lacaios ou constructos, você pode escolher absorver a aura de uma técnica sob o efeito do “Emissão de Aura” ao chegar no alcance de toque, recuperando metade da aura gasta na execução da técnica e adicionando a aura gerada.</p>"
