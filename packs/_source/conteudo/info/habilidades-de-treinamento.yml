    name: Corpo Aprimorado
    type: text
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p>Você se torna capaz de utilizar aura para aprimorar certos aspectos
        do seu corpo para ajuda-lo em diversas situações, ao consumir 2 Pontos
        de Aura, você pode ativar um dos seguintes
        aprimoramentos:</p><ul><li><p><strong>Voz Aprimorada:</strong> Você pode
        amplificar tanto sua voz que ela pode ser ouvida por até 3
        km.</p></li><li><p><strong>Musculatura Aprimorada:</strong> Você
        triplica sua capacidade de carga atual.</p></li><li><p><strong>Atributos
        Aprimorados:</strong> Você pode receber 1d4 na sua próxima rolagem de
        perícia, sem ser da perícia Nen.</p></li><li><p><strong>Regeneração
        Aprimorada:</strong> Você pode rolar 1 dado de vida como se estivesse
        realizando um descanso curto e recuperar o resultado em Pontos de Vida.
        Você consome 1 dado para usar essa característica.</p></li></ul>
