  - sort: 1500000
    name: Liberação Conjuradora
    type: text
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p>Ao usar um ou mais dados de conjurador para qualquer coisa, você pode
        pegar o resultado dos 2 primeiros dados rolados nesse turno e gerar
        Pontos de Aura igual ao resultado da rolagem. Qualquer resultado além
