  - sort: 1000000
    name: Gyo
    type: text
    _id: tKUzIPAxkmVdRG7C
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p>A técnica Gyo\_(凝\_coagulação) ou \"congelamento\" é uma\_aplicação avançada\_do\_conceito da prática, que consiste na concentração da aura em uma parte específica do corpo. Esta técnica pode aumentar dramaticamente a habilidade e força da parte do corpo escolhida, mas deixa o resto do corpo desprotegido contra ataques de Nen. A técnica é mais comumente utilizada nos olhos, permitindo a um usuário novato enxergar a aura de outras pessoas e objetos escondidos com o uso da Nen. É implícito que usuários experientes podem realizar a técnica nos olhos instintivamente, sem precisar de preparação.</p><ul><li><p class=\"MsoNormal\"><strong>Requisito:</strong> Ren, 3 Pontos de Nen.</p></li><li><p class=\"MsoNormal\"><strong>Técnicas:</strong> Você recebe acesso as técnicas “Detectar Aura”, “Salto Concentrado”, “Investida Focada”, “Sentidos Aprimorados”, “Gyo – Foco Rápido”, “Gyo - Golpe Devastador” e “Gyo – Foco Destruidor”.</p></li><li><p class=\"MsoNormal\"><strong>Característica:</strong> Nenhuma</p></li></ul>"
    video:
