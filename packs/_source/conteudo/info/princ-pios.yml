    text:
      format: 1
      content: "<p class=\"MsoNormal\">Shu\_(周 envolver), é uma aplicação avançada de\_Ten\_e\_Ren.\_Shu\_permite o usuário de Nen a envolver um objeto com sua própria aura, fazendo ela tornar-se um tipo de extensão de seu próprio corpo, tornando o objeto mais forte. Em outras palavras, como\_Ten, permite que o usuário controle e envolva seu próprio corpo com sua aura, permitirá também envolver um objeto que estiver tocando; e como\_Ren\_permite aumentar a força e resistência do corpo do usuário, usando se\_Ren\_no objeto o tornaria mais forte e resistente.\_</p><ul><li><p class=\"MsoNormal\"><strong>Requisito:</strong> Ten e Hatsu, Estágio Perito, 3 Pontos de Nen.</p></li><li><p class=\"MsoNormal\"><strong>Técnicas:</strong> Você recebe acesso as técnicas “Shu – Revestimento”.</p></li><li><p class=\"MsoNormal\"><strong>Característica:</strong> Nenhum</p></li></ul>"
