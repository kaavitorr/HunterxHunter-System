      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p>O primeiro princípio é o de\_Ten (纏\_envoltura), que é utilizado para diminuir (ou mesmo evitar) a perda gradual de aura pela qual todo ser vivo passa, mantendo a circulação da aura dentro e ao redor do corpo. Uma vez mantida, a aura age como uma segunda pele, servindo de proteção contra os mais básicos golpes que utilizam o Nen (Aura). Essa camada de aura produz uma sensação parecida com a de um fluido viscoso, emanando um constante e confortável calor. A maestria do princípio da envoltura pode ser atingida pelo uso de meditação, e reduz drasticamente os efeitos do envelhecimento no corpo do usuário, mantendo-o apto mesmo em idade avançada.</p><ul><li><p class=\"MsoNormal\"><strong>Requisito:</strong> Aprendendo o Ten.</p></li><li><p class=\"MsoNormal\"><strong>Técnicas:</strong> Você recebe acesso a técnica “Ten – Defesa Sólida”.</p></li><li><p class=\"MsoNormal\"><strong>Característica:</strong> Enquanto sua aura estiver ativa, você não sofre dano dobrado de ataques com Ren.</p></li></ul>"
    video:
