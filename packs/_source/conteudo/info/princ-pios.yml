  - sort: 900000
    name: Habilidade Especial
    type: text
    system: {}
    title:
      show: true
      level: 2
    image: {}
    text:
      format: 1
      content: >-
        <p class="MsoNormal">Desde que você possua Aura Assassina ou Despertar
        Aura, você pode pegar essa habilidade e liberar acesso ao seu Hatsu de
        acordo com o Manual
        Shingen-Ryu.</p><ul><li><p><strong>Requisito:</strong> 3 Pontos de
        Nen.</p></li></ul><table><tbody><tr><td><p><span
        style="font-size:large"><strong>APRENDENDO UM
        HATSU</strong></span></p><p class="Default">Para aprender um Hatsu com
        sucesso, você deve primeiro treinar o básico para que sua habilidade
        seja possível. Para isso, você deve treinar pelo menos o Nível 1 de
        Treinamento de Categoria de cada uma das categorias que sua primeira
        habilidade irá utilizar, de acordo com o Capítulo 6.9.</p><p
        class="Default">Se você deseja criar uma habilidade que possui um efeito
        com um requisito de nível avançado (6 ou maior) de treinamento, você
        pode ignorar esse requisito para sua primeira habilidade desde que esse
        efeito seja de sua categoria.</p><p>A partir da sua segunda manifestação
        de habilidade, você deve cumprir todos os requisitos de Nível de
        Treinamento de Categoria para todos os efeitos que desejar adicionar,
        mesmo que seja um que exista na sua primeira
        manifestação.</p></td></tr></tbody></table>
