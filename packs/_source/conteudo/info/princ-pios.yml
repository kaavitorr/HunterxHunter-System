      format: 1
      content: "<p>A técnica Ken\_(堅 fortificar) é outra aplicação avançada de\_Ren.\_Ken\_é usado mais para fins defensivos. Aumenta-se a potência do uso de\_Ren, tornando o corpo mais resistente. É como um\_Gyo, mas usado no corpo todo. E por aumentar consideravelmente a força defensiva do corpo, é também muito cansativo de se manter. É mais usado quando se suspeita de o inimigo estar usando algum tipo de ataque surpresa.</p><ul><li><p class=\"MsoNormal\"><strong>Requisito:</strong> “Explosão Defensiva”, “Último Recurso” e “Foco Defensivo”, Estágio Mestre, 5 Pontos de Nen.</p></li><li><p class=\"MsoNormal\"><strong>Técnicas:</strong> Você recebe acesso as técnicas “Ken – Defesa Absoluta”.</p></li><li><p class=\"MsoNormal\"><strong>Característica:</strong> Nenhuma</p></li></ul>"
