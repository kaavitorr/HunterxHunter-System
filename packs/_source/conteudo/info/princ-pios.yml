        Pontos de Armadura ativos, você adquire resistência a todos os tipos de
        dano. Os Pontos de Armadura são totalmente restaurados após 10 minutos
        de descanso sem utilizar aura. Você não pode utilizar Foco Agressivo e
        Defensivo ao mesmo tempo.</p><ul><li><p><strong>Requisito:</strong>
        Explosão Defensiva, Estágio Perito, 6 Pontos de Nen.</p></li></ul>
