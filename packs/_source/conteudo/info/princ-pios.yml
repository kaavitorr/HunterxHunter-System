    text:
      format: 1
      content: "<p>O segundo princípio é o de\_Zetsu (絕\_corte), que é utilizado para suprimir o fluxo externo da aura do indivíduo, ocultando sua presença de outros usuários da Nen. O fluxo para porque os nós de aura são fechados por meio de manipulação da Nen, aliviando a fadiga do usuário e deixando-o completamente desprotegido contra ataques de Nen como efeitos colaterais. A técnica é muito utilizada por assassinos profissionais e Hunters de lista negra, por tornar possível a aproximação e posterior captura ou eliminação de um usuário de Nen.</p><ul><li><p class=\"MsoNormal\"><strong>Requisito:</strong> Conhecendo o Zetsu.</p></li><li><p class=\"MsoNormal\"><strong>Técnicas:</strong> Você recebe acesso a técnica “Zetsu – Anular Presença”.</p></li><li><p class=\"MsoNormal\"><strong>Característica:</strong> Você se torna capaz de cortar totalmente o fluxo de aura, permitindo que você possa usar Furtividade contra criaturas que possam ver aura.</p></li></ul>"
