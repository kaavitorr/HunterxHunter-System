  - sort: 600000
    name: Ren
    type: text
    _id: dDA3JlaAxNcwh9q4
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p>O terceiro princípio é o de\_Ren\_(練 prática). Utilizando-se do primeiro princípio, o usuário não precisa se preocupar com a perda natural de aura do corpo, podendo manifestar uma quantidade grande de energia a seu redor. A prática se foca em expandir e intensificar a aura o máximo possível aumentando a força e durabilidade do corpo do usuário, sendo muito utilizado para técnicas ofensivas. Desta forma, pode-se dizer que envoltura e prática, apesar de baseados um no outro, são princípios opostos.</p><ul><li><p class=\"MsoNormal\"><strong>Requisito:</strong> Dominando o Ren.</p></li><li><p class=\"MsoNormal\"><strong>Técnicas:</strong> Você recebe acesso as técnicas “Ren – Explosão de Aura” e “Ren – Parede de Aura”.</p></li><li><p class=\"MsoNormal\"><strong>Característica:</strong> Você passa a causar o dobro de dano em criaturas que não possuam aura ou estejam com “Zetsu” ativo.</p></li></ul>"
