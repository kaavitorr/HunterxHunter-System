    text:
      format: 1
      content: >-
        <p class="MsoNormal">Você envolve seu corpo com uma camada extra de
        aura, criando 20 Pontos de Armadura. Esses pontos funcionam da mesma
        forma que os Pontos de Vida Temporários, com as seguintes
        diferenças:</p><ul><li><p><em>Podem coexistir com PV
