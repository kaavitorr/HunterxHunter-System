  - sort: 800000
    name: Hatsu
    type: text
    _id: g4ekIubZUuTZrb2D
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p>O quarto e último dos princípios fundamentais é o do Hatsu\_(發 Liberação), que consiste na transmissão ou projeção da aura do indivíduo, geralmente utilizado antes de uma técnica avançada. A liberação de Nen varia muito de acordo com a aura e estados físico e mental do usuário, criando uma capacidade sobrenatural e técnicas pessoais únicas. A liberação reflete o caráter e vontade do usuário no exterior, contanto que este pratique a Nen por si próprio, e não somente copie as habilidades de outros.</p><ul><li><p class=\"MsoNormal\"><strong>Requisito:</strong> Alcançando o Hatsu.</p></li><li><p class=\"MsoNormal\"><strong>Técnicas:</strong> Você recebe acesso as técnicas “Hatsu – Sede de Sangue”.</p></li><li><p class=\"MsoNormal\"><strong>Característica:</strong> Nenhuma</p><p class=\"MsoNormal\"></p></li></ul>"
