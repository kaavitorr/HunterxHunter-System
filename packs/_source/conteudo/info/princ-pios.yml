    _id: 0JfFZMXVsuGW6vV6
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p>A técnica En (圓 círculo) é a aplicação avançada de\_Ten\_e\_Ren. O usuário expande sua aura através do\_Ren, criando um campo de aura mais extenso. Usando-se então\_Ten, o usuário da forma ao campo de aura, normalmente num círculo. Qualquer coisa que aparecer ou se mexer dentro desse campo de aura será imediatamente sentido pelo usuário.</p><ul><li><p class=\"MsoNormal\"><strong>Requisito:</strong> Ten e Ren, Estágio Perito, 3 Pontos de Nen.</p></li><li><p class=\"MsoNormal\"><strong>Técnicas:</strong> Você recebe acesso as técnicas “En – Sentido Verdadeiro”.</p></li><li><p class=\"MsoNormal\"><strong>Característica:</strong> Você pode utilizar sua ação de poder para realizar um Teste de Atributo de Espírito (Percepção) com vantagem, para tentar perceber todas as criaturas escondidas dentro de uma área, recebendo percepção as cegas em um alcance de 3 metros de raio ao seu redor. Essa habilidade consome 2 Pontos de Aura em sua ativação e no início de cada um de seus turnos. Você é imune a condição “Surpreso” contra ataques dentro da área do seu En.</p></li><li><p class=\"MsoNormal\"><strong>Sobrecarga:</strong> Enquanto estiver com o En ativo, você tem desvantagem em Testes de Percepção se o número de criaturas dentro da área for superior ao seu atributo de Espírito. Se o número de criaturas for superior a 30, você recebe -1 para cada criatura acima dessas 30 iniciais.</p></li></ul>"
